<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <!-- BotFather "Description Picture" (640x360): bo'sh chatda tavsif ustida ko'rinadi. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#0b8f60"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#053b28" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fon -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <circle cx="610" cy="30" r="120" fill="#ffffff" opacity="0.07"/>
  <circle cx="30" cy="340" r="110" fill="#ffffff" opacity="0.06"/>
  <path d="M268 40 C271 51 274 54 285 57 C274 60 271 63 268 74 C265 63 262 60 251 57 C262 54 265 51 268 40 Z" fill="#ffffff" opacity="0.5"/>

  <!-- Savat (logo bilan bir xil, kichraytirilgan) -->
  <g transform="translate(-37,-16.6) scale(0.34)">
    <g filter="url(#drop)">
      <path d="M364 448 A148 148 0 0 1 660 448" stroke="#ffffff" stroke-width="46" fill="none" stroke-linecap="round"/>
      <rect x="240" y="420" width="544" height="66" rx="33" fill="#ffffff"/>
      <path d="M286 486 L738 486 L706 750 Q700 804 646 804 L378 804 Q324 804 318 750 Z" fill="#ffffff"/>
      <rect x="368" y="552" width="66" height="66" rx="18" fill="#0b8f60"/>
      <path d="M385 585 L399 600 L420 569" stroke="#ffffff" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="462" y="568" width="194" height="34" rx="17" fill="#0b8f60"/>
      <rect x="374" y="666" width="54" height="54" rx="14" fill="none" stroke="#0b8f60" stroke-width="12"/>
      <rect x="462" y="676" width="150" height="34" rx="17" fill="#0b8f60"/>
    </g>
    <g filter="url(#drop)">
      <circle cx="726" cy="768" r="146" fill="url(#badge)"/>
      <path d="M656 770 L706 820 L798 712" stroke="#ffffff" stroke-width="42" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Matn -->
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="292" y="118" font-size="54" font-weight="800" fill="#ffffff">Bozorlik Bot</text>
    <text x="292" y="162" font-size="25" font-weight="500" fill="#ffffff" opacity="0.92">Oilaviy bozorlik ro'yxati</text>

    <!-- Imkoniyat chiplari -->
    <g font-size="19" font-weight="600" fill="#ffffff">
      <rect x="292" y="196" width="148" height="44" rx="22" fill="#ffffff" opacity="0.16"/>
      <rect x="292" y="196" width="148" height="44" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="366" y="224" text-anchor="middle">👥 Ulashish</text>

      <rect x="452" y="196" width="140" height="44" rx="22" fill="#ffffff" opacity="0.16"/>
      <rect x="452" y="196" width="140" height="44" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="522" y="224" text-anchor="middle">💰 Byudjet</text>

      <rect x="292" y="252" width="144" height="44" rx="22" fill="#ffffff" opacity="0.16"/>
      <rect x="292" y="252" width="144" height="44" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="364" y="280" text-anchor="middle">⏰ Eslatma</text>

      <rect x="448" y="252" width="104" height="44" rx="22" fill="#ffffff" opacity="0.16"/>
      <rect x="448" y="252" width="104" height="44" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="500" y="280" text-anchor="middle">🌐 8 til</text>
    </g>
  </g>
</svg>
